<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>R2D3 - Moteur pédagogique de simulation technique</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.6}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:Canvas;color:CanvasText}
    main{box-sizing:border-box;max-width:780px;padding:3rem 1.5rem}
    h1{font-size:clamp(2.3rem,8vw,4rem);line-height:1.1;letter-spacing:-.04em;margin:0 0 .5rem}
    .lead{font-size:1.3rem;font-weight:600;margin:.3rem 0 1.8rem}
    p{max-width:60ch}
    .status{border:1px solid color-mix(in srgb,CanvasText 22%,Canvas);border-radius:12px;padding:1rem 1.25rem}
    a{color:LinkText}
  </style>
</head>
<body>
<main>
  <h1>R2D3</h1>
  <p class="lead">Moteur pédagogique de simulation technique</p>
  <section class="status" aria-label="État du projet">
    <strong>Espace en préparation</strong>
    <p>Ce site accueillera le moteur autonome R2D3 et ses démonstrations validées.</p>
    <p>Aucun simulateur n'est encore publié sur cette page.</p>
  </section>
  <p><a href="https://github.com/chaoli22000bzh/R2D3">Consulter le dépôt GitHub</a></p>
</main>
</body>
</html>
