<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R2D3 | Laboratoire commun de couverture radio</title>
<style>
:root{color-scheme:light;--bg:#edf2f5;--fg:#20323b;--panel:#fff;--line:#9eafb9;--sub:#526874}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#16232b;--fg:#e7eff4;--panel:#263a46;--line:#8195a1;--sub:#c5d2d9}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,Arial}main{max-width:1000px;margin:auto;padding:14px}h1{font-size:22px;margin:0 0 4px}p{margin:6px 0 12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px;margin-top:10px}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:end}label{display:grid;gap:3px}select,button{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:7px;min-height:36px;font:inherit}button{cursor:pointer}
#plan{position:relative;width:100%;max-height:520px;min-height:260px;border:2px solid var(--line);background:var(--bg);overflow:hidden;cursor:crosshair;margin-top:12px}
.cell{position:absolute;transform:translate(-50%,-50%);opacity:.64;pointer-events:none}.good{background:#38a06f}.weak{background:#e8be42}.bad{background:#cf6666}
.wall{position:absolute;height:0;border-top:4px solid var(--line);transform-origin:left center;pointer-events:none;z-index:3}.wall.light{border-top-color:#879da9}.wall.solid{border-top-color:#535d67;border-top-width:7px}.wall.metal{border-top-color:#355b83;border-top-width:8px}
.tx{position:absolute;transform:translate(-50%,-50%);background:#126cbd;color:#fff;border:2px solid white;border-radius:50%;width:32px;height:32px;display:grid;place-items:center;z-index:4;pointer-events:none;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:15px;font-size:13px;margin-top:8px}.legend b{display:inline-block;width:12px;height:12px;margin-right:4px}#report{font-weight:650;margin-top:10px}#details{color:var(--sub)}
</style></head><body><main><h1>R2D3 : laboratoire commun de couverture radio</h1><p>Un seul moteur pour des exercices Wi-Fi, DECT, mesh et réseaux mobiles. Modèle simplifié pour comprendre le placement des émetteurs.</p>
<section class="panel"><div class="controls"><label>Environnement<select id="site"><option value="offices">Bureaux sur trois niveaux</option><option value="workshop">Atelier et parking</option></select></label><label>Profil<select id="profile"><option value="neutral">Radio pédagogique</option><option value="wifi">Wi-Fi (illustration)</option><option value="dect">DECT (illustration)</option><option value="cellular">Réseau mobile (illustration)</option><option value="mesh">Mesh (illustration)</option></select></label><label>Niveau<select id="floor"></select></label><label>Émetteur à déplacer<select id="tx-select"><option value="0">Émetteur 1</option><option value="1">Émetteur 2</option><option value="2">Émetteur 3</option></select></label><button id="reset">Réinitialiser</button></div>
<div id="plan" aria-label="Plan interactif, cliquer pour placer l'émetteur sélectionné"></div>
<div class="legend"><span><b style="background:#38a06f"></b>Bonne couverture</span><span><b style="background:#e8be42"></b>Faible</span><span><b style="background:#cf6666"></b>Insuffisante</span><span>● Émetteur bleu</span></div><p id="report" aria-live="polite"></p><p id="details"></p>
</section></main><script type="module" src="./main.js"></script></body></html>
