name: Integration Identity Access Core (vrais moteurs R2D3)
on:
  push:
    branches: [main]
    paths:
      - 'src/identity-access-host.js'
      - 'src/r2d3-core.js'
      - 'src/asset-profiles.js'
      - 'tests-integration/**'
      - '.github/workflows/identity-access-integration.yml'
  pull_request:
    paths:
      - 'src/identity-access-host.js'
      - 'src/r2d3-core.js'
      - 'src/asset-profiles.js'
      - 'tests-integration/**'
      - '.github/workflows/identity-access-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: R2D3
      - uses: actions/checkout@v4
        with:
          repository: chaoli22000bzh/C2-Lab
          ref: 4405bb6806ef0e93997c7029dc21824b07c73cd6
          path: identity-source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run real integration against pinned Identity Access Core
        working-directory: R2D3
        env:
          IDENTITY_ACCESS_SOURCE_ROOT: ../identity-source/identity-access-v1
        run: node --test tests-integration/identity-access.test.mjs
